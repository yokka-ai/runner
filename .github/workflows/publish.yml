name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing and the provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs npm 11.5.1 or newer, which ships with Node 24.
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: The tag and package.json agree (the runner reads its version from package.json)
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          [ "$tag" = "$pkg" ]
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx biome ci
      - run: npm run test:coverage
      - name: Pack (dry run) and check the file list
        run: npm run pack:check
      - run: node dist/cli.js verify
      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Only needed until trusted publishing is set up on npmjs.com; npm prefers OIDC when it's configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
